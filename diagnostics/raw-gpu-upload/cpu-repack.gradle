gradle.beforeProject { project ->
    project.pluginManager.withPlugin('com.android.application') {
        project.androidComponents.finalizeDsl { android ->
            android.defaultConfig.applicationId = 'com.llawsxx.uvclivestreaming.rawpipeline'
            android.sourceSets.androidTest.kotlin.exclude('**/UsbUacCaptureDeviceTest.kt')
            def original = project.file('src/main/java/com/llawsxx/uvclivestreaming/recording/RawVideoConverter.kt').getText('UTF-8')
            def start = original.indexOf('    fun convert(bytes: CapturedVideoBuffer,')
            def end = original.indexOf('    fun convert(bytes: ByteArray,', start)
            if (start < 0 || end < 0) throw new GradleException('Captured-buffer converter signature changed')
            def replacement = '''    fun convert(bytes: CapturedVideoBuffer, format: Int, width: Int, height: Int, timestampNs: Long): ConvertedFrame? {
        try {
            if (closed) {
                bytes.close()
                return null
            }
            val repacked = convertImpl(bytes.size, format, width, height, timestampNs) { destination ->
                NativeUsbCapture.nativeConvertRawBufferToGpuBuffer(bytes.buffer, bytes.size, format, width, height, destination)
            }
            if (repacked == null) {
                bytes.close()
                return null
            }
            return ConvertedFrame(repacked.frame, AutoCloseable {
                try { repacked.close() } finally { bytes.close() }
            })
        } catch (error: Throwable) {
            bytes.close()
            throw error
        }
    }

'''
            def sourceRoot = project.layout.buildDirectory.dir('generated/cpu-repack-diagnostic').get().asFile
            def generated = new File(sourceRoot, 'CpuRepackingRawVideoConverter.kt')
            generated.parentFile.mkdirs()
            generated.setText(original.substring(0, start) + replacement + original.substring(end), 'UTF-8')
            android.sourceSets.main.kotlin.exclude('**/RawVideoConverter.kt')
            android.sourceSets.main.kotlin.srcDir(sourceRoot)
        }
    }
}
